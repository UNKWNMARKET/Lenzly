<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#060606"/>
  <!-- Corner brackets -->
  <path d="M60,60 L60,120 M60,60 L120,60" stroke="#C9A84C" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M1020,60 L1020,120 M1020,60 L960,60" stroke="#C9A84C" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M60,1020 L60,960 M60,1020 L120,1020" stroke="#C9A84C" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M1020,1020 L1020,960 M1020,1020 L960,1020" stroke="#C9A84C" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Concentric aperture rings -->
  <circle cx="540" cy="540" r="380" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.08"/>
  <circle cx="540" cy="540" r="320" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.10"/>
  <circle cx="540" cy="540" r="260" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.12"/>
  <circle cx="540" cy="540" r="200" fill="none" stroke="#C9A84C" stroke-width="1.2" opacity="0.16"/>
  <circle cx="540" cy="540" r="140" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.22"/>
  <circle cx="540" cy="540" r="80" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.30"/>
  <!-- Crosshair lines -->
  <line x1="540" y1="60" x2="540" y2="460" stroke="#C9A84C" stroke-width="0.8" opacity="0.18"/>
  <line x1="540" y1="620" x2="540" y2="1020" stroke="#C9A84C" stroke-width="0.8" opacity="0.18"/>
  <line x1="60" y1="540" x2="460" y2="540" stroke="#C9A84C" stroke-width="0.8" opacity="0.18"/>
  <line x1="620" y1="540" x2="1020" y2="540" stroke="#C9A84C" stroke-width="0.8" opacity="0.18"/>
  <!-- Center dot -->
  <circle cx="540" cy="540" r="6" fill="#C9A84C" opacity="0.9"/>
  <circle cx="540" cy="540" r="2" fill="#FFFFFF"/>
  <!-- COMING SOON text -->
  <text x="540" y="750" font-family="Georgia, serif" font-size="120" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">COMING</text>
  <text x="540" y="880" font-family="Georgia, serif" font-size="120" font-weight="400" fill="#C9A84C" text-anchor="middle" letter-spacing="-2" font-style="italic">SOON.</text>
  <!-- Top label -->
  <text x="540" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#C9A84C" text-anchor="middle" letter-spacing="6" opacity="0.6">LENZLY</text>
  <!-- Bottom label -->
  <text x="540" y="990" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" opacity="0.22">@LENZLY · APP STORE</text>
</svg>
