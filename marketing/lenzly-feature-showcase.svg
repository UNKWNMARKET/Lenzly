  <text x="156" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.36">PRO profiles. Direct client connections. No middleman.</text>
  <text x="112" y="544" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#C9A84C" letter-spacing="4" opacity="0.6">03</text>
  <text x="156" y="544" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" letter-spacing="0.5" opacity="0.92">Encrypted Messaging</text>
  <text x="156" y="566" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.36">End-to-end private. Your conversations, only yours.</text>
