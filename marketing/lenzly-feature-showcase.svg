  <text x="156" y="400" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" letter-spacing="0.5" opacity="0.92">Community Discovered</text>
  <text x="156" y="422" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.36">Real photo spots. Live weather. One-tap directions.</text>
