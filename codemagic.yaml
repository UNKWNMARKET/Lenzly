workflows:
  ios-app-store:
    name: LENZLY iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Admin

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.unkwnmarket.lenzly
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.unkwnmarket.lenzly"
        DEVELOPMENT_TEAM: "S9HC8WQ7YH"
      node: 22.12.0
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Configure code signing
        script: xcode-project use-profiles

      - name: Build and export IPA
        script: |
          set -e
          mkdir -p /tmp/xcodebuild_logs

          # Read the UUID of the provisioning profile installed by ios_signing
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found in ~/Library/MobileDevice/Provisioning Profiles/"
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin)
          echo "Provisioning profile: $PROFILE_PATH"
          echo "UUID: $PROFILE_UUID"
          echo "Keychain identities:"
          security find-identity -v -p codesigning

          set -o pipefail

          # Archive — explicitly supply the profile UUID so Xcode never has to guess
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            2>&1 | tee /tmp/xcodebuild_logs/archive.log

          # Export — use the plist written by use-profiles
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath "$CM_BUILD_DIR/ipa" \
            2>&1 | tee /tmp/xcodebuild_logs/export.log

    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
