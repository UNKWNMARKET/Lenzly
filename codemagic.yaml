workflows:
  ios-app-store:
    name: LENZLY iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Admin

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.unkwnmarket.lenzly
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.unkwnmarket.lenzly"
        DEVELOPMENT_TEAM: "S9HC8WQ7YH"
      node: 22.12.0
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Configure code signing
        script: |
          set -e
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          # Wipe the local profile file cache so the old revoked profile
          # (UUID 3251be6b) cannot be reinstalled from a previous build
          rm -rf "$PROFILES_DIR"
          mkdir -p "$PROFILES_DIR"

          # ios_signing already set up the cert + keychain above.
          # Fetch a fresh provisioning profile from Apple linked to that cert.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --profiles-dir "$PROFILES_DIR"

          # Hard check — fail here if no profile landed on disk
          PROFILE_COUNT=$(ls "$PROFILES_DIR"/*.mobileprovision 2>/dev/null | wc -l | tr -d ' ')
          echo "Profiles downloaded: $PROFILE_COUNT"
          if [ "$PROFILE_COUNT" -eq 0 ]; then
            echo "ERROR: fetch-signing-files did not save a profile"
            exit 1
          fi

          for f in "$PROFILES_DIR"/*.mobileprovision; do
            security cms -D -i "$f" -o /tmp/profile.plist
            echo "  Name : $(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
            echo "  UUID : $(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
          done

          # Generate export_options.plist and configure Xcode project
          xcode-project use-profiles

          echo "=== Keychain identities ==="
          security find-identity -v -p codesigning

      - name: Build and export IPA
        script: |
          set -e
          mkdir -p /tmp/xcodebuild_logs
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_PATH=$(ls "$PROFILES_DIR"/*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile installed"
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" -o /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          echo "Using profile UUID: $PROFILE_UUID"

          if [ "$PROFILE_UUID" = "3251be6b-b092-46a1-a599-c14b249f8de9" ]; then
            echo "ERROR: Old revoked profile came back — Codemagic cache not cleared."
            exit 1
          fi

          set -o pipefail

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            2>&1 | tee /tmp/xcodebuild_logs/archive.log

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath "$CM_BUILD_DIR/ipa" \
            2>&1 | tee /tmp/xcodebuild_logs/export.log

    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
