workflows:
  ios-app-store:
    name: LENZLY iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Admin

    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.unkwnmarket.lenzly"
        DEVELOPMENT_TEAM: "S9HC8WQ7YH"
      node: 22.12.0
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Set up code signing
        script: |
          # Fresh keychain — no revoked certs can enter
          keychain initialize

          # Always create a brand-new distribution cert (new serial + private key)
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save

          # Add ONLY the new cert to the fresh keychain
          keychain add-certificates

          # Diagnostic — confirm only the new cert is present
          echo "=== Keychain identities ==="
          security find-identity -v -p codesigning

          # Create a fresh provisioning profile linked to the new cert
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # Write the profile into the Xcode project and generate export_options.plist
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
