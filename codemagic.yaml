workflows:
  ios-app-store:
    name: LENZLY iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Admin

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.unkwnmarket.lenzly
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.unkwnmarket.lenzly"
      node: 22.12.0
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios
          echo "=== Package.swift after sync ==="
          cat ios/App/CapApp-SPM/Package.swift

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Set up Xcode code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1

      - name: Export IPA
        script: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath "$CM_BUILD_DIR/ipa" \
            2>&1

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
